# Fork (elboaf) Windows release lane.
#
# Differences from upstream's windows-installer.yml:
# - Builds the x64 Browser-only installer only (no arm64, no Full installer).
# - No code signing: upstream's sign-and-test job needs Hacker Valley Media's
#   Azure Artifact Signing account and pinned signing toolchain, which a fork
#   does not have. Integrity ships as SHA256SUMS instead.
# - Artifacts upload to a draft GitHub release on this fork. Upstream's
#   attestation, WinGet, and signed-feed publication steps are dropped.
#
# The toolchain lock (scripts/installer/windows-toolchain.lock.json) pins the
# runner image, Bun, and Inno Setup; this workflow verifies the runner image
# against it before running any tool, same as upstream.

name: Windows Installer (fork)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify runner image before executing tools
        shell: pwsh
        run: |
          $lock = Get-Content scripts/installer/windows-toolchain.lock.json -Raw | ConvertFrom-Json
          if ($env:ImageOS -ne $lock.runner.imageOS -or $env:ImageVersion -ne $lock.runner.imageVersion) {
            throw "Unapproved runner image: $env:ImageOS $env:ImageVersion (lock wants $($lock.runner.imageOS) $($lock.runner.imageVersion); bump the lock when the windows-2025 image rolls)"
          }

      - name: Resolve and verify release version
        id: version
        shell: pwsh
        run: |
          # Tag pushes must match package.json; workflow_dispatch builds the
          # package.json version directly so a release tag is not required.
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw 'Windows production builds must run from an exact stable vX.Y.Z tag.'
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -ne $packageVersion) { throw "Tag $version does not match package.json $packageVersion" }
          } else {
            $version = $packageVersion
            if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "package.json version $version must be stable X.Y.Z" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Verify Bun pin
        shell: pwsh
        run: |
          $expected = (Get-Content .bun-version -Raw).Trim()
          if ((bun --version).Trim() -ne $expected) { throw 'Bun version does not match .bun-version' }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Chrome Web Store identity is approved (store-identities.json), so the
      # release lane validates and ships the production identity: the manifest
      # key must derive the approved store ID, and only approved IDs are emitted.
      - name: Validate store identity consistency
        run: bun scripts/installer/generate-native-host.ts --output native-host-production.json

      # Bun's own cross-target fetch renames across drives (workspace on D:,
      # cache on C:) and fails on these runners, so pre-seed the pinned target
      # executables in the workspace root, where bun looks before downloading.
      - name: Pre-seed pinned Bun cross-compile targets
        shell: pwsh
        run: |
          $lock = Get-Content scripts/installer/windows-toolchain.lock.json -Raw | ConvertFrom-Json
          foreach ($target in $lock.bunCompileTargets) {
            $tarball = Join-Path $env:RUNNER_TEMP "$($target.seedFile).tgz"
            Invoke-WebRequest -Uri $target.url -OutFile $tarball
            if ((Get-FileHash $tarball -Algorithm SHA256).Hash.ToLowerInvariant() -ne $target.sha256) { throw "Hash mismatch: $($target.seedFile)" }
            $extract = Join-Path $env:RUNNER_TEMP "$($target.seedFile)-extract"
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            tar -xzf $tarball -C $extract
            if ($LASTEXITCODE -ne 0) { throw "Extraction failed: $($target.seedFile)" }
            Move-Item (Join-Path $extract 'package/bin/bun.exe') $target.seedFile
          }

      - name: Build native Windows payloads
        shell: bash
        run: |
          bash scripts/build.sh --target=windows-x64

      - name: Verify versions and PE architectures
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          if ((& dist/windows/x64/interceptor.exe --version) -notmatch [regex]::Escape($version)) { throw 'x64 CLI version mismatch' }
          function Get-Machine([string]$Path) {
            $bytes = [IO.File]::ReadAllBytes($Path)
            $pe = [BitConverter]::ToInt32($bytes, 0x3c)
            return [BitConverter]::ToUInt16($bytes, $pe + 4)
          }
          $expected = @{
            'dist/windows/x64/interceptor.exe' = 0x8664
            'dist/windows/x64/daemon/interceptor-daemon.exe' = 0x8664
          }
          foreach ($entry in $expected.GetEnumerator()) {
            if ((Get-Machine $entry.Key) -ne $entry.Value) { throw "PE architecture mismatch: $($entry.Key)" }
          }

      - name: Upload unsigned payloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-unsigned-${{ steps.version.outputs.version }}
          path: dist/windows
          if-no-files-found: error
          retention-days: 1

  package-and-test:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify runner image before executing tools
        shell: pwsh
        run: |
          $lock = Get-Content scripts/installer/windows-toolchain.lock.json -Raw | ConvertFrom-Json
          if ($env:ImageOS -ne $lock.runner.imageOS -or $env:ImageVersion -ne $lock.runner.imageVersion) {
            throw "Unapproved runner image: $env:ImageOS $env:ImageVersion (lock wants $($lock.runner.imageOS) $($lock.runner.imageVersion); bump the lock when the windows-2025 image rolls)"
          }

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { "version=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_OUTPUT }
          else { "version=$((Get-Content package.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT }

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-unsigned-${{ steps.version.outputs.version }}
          path: dist/windows

      # Acquire the pinned Inno Setup (hash-checked against the toolchain lock).
      # No signing toolchain: this fork ships unsigned artifacts. Inno Setup 7's
      # license needs acknowledgment before use, same gate upstream applies.
      - name: Acquire pinned Inno Setup
        id: tools
        shell: pwsh
        run: |
          if ('${{ vars.INNO_SETUP_LICENSE_ACKNOWLEDGED }}' -ne 'true') { throw 'Set the repository variable INNO_SETUP_LICENSE_ACKNOWLEDGED=true (Settings > Secrets and variables > Actions > Variables) after confirming your Inno Setup 7 use is licensed.' }
          $lock = Get-Content scripts/installer/windows-toolchain.lock.json -Raw | ConvertFrom-Json
          $toolRoot = Join-Path $env:RUNNER_TEMP 'interceptor-windows-tools'
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null
          $innoInstaller = Join-Path $toolRoot 'inno-setup.exe'
          Invoke-WebRequest -Uri $lock.innoSetup.url -OutFile $innoInstaller
          if ((Get-FileHash $innoInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne $lock.innoSetup.sha256) { throw 'Hash mismatch: inno-setup.exe' }
          $signature = Get-AuthenticodeSignature $innoInstaller
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch [regex]::Escape($lock.innoSetup.publisher)) { throw 'Inno Setup publisher verification failed' }
          $innoRoot = Join-Path $toolRoot 'inno'
          $proc = Start-Process $innoInstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',("/DIR=$innoRoot") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw 'Pinned Inno Setup installation failed' }
          "iscc=$innoRoot/ISCC.exe" >> $env:GITHUB_OUTPUT

      # Unsigned build: no Inno sign tool is passed and no signing define is set;
      # Inno writes the uninstaller directly.
      - name: Compile x64 installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          & '${{ steps.tools.outputs.iscc }}' "/DAppVersion=$version" "/DArtifactArch=x64" scripts/installer/interceptor.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno compile failed: x64" }

      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          Get-ChildItem dist/release/windows -Filter *.exe | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content dist/release/windows/SHA256SUMS -Encoding ascii

      - name: Install, verify, repair, and uninstall x64 package
        shell: pwsh
        run: scripts/installer/test-windows-installer.ps1 -Installer "dist/release/windows/Interceptor-Browser-${{ steps.version.outputs.version }}-windows-x64.exe" -Architecture x64 -Version "${{ steps.version.outputs.version }}" -DisposableMachine

      - name: Upload release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release-${{ steps.version.outputs.version }}
          path: dist/release/windows
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: package-and-test
    # Tags publish a draft release; workflow_dispatch builds are only CI
    # (fetch the installer from the windows-release-* artifact).
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != 'tag' ]; then echo 'A tag is required' >&2; exit 1; fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-release-${{ steps.version.outputs.version }}
          path: dist/release/windows

      - name: Create or verify immutable draft and upload once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > existing.json 2>/dev/null; then
            jq -e '.isDraft == true' existing.json > /dev/null || { echo 'Refusing to mutate a published release' >&2; exit 1; }
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$tag"
            echo '{"assets":[]}' > existing.json
          fi
          existingNames="$(jq -r '.assets[].name' existing.json)"
          for file in dist/release/windows/*; do
            name="$(basename "$file")"
            if grep -qx "$name" <<< "$existingNames"; then echo "Release asset already exists: $name" >&2; exit 1; fi
          done
          gh release upload "$tag" dist/release/windows/* --repo "$GITHUB_REPOSITORY"

      - name: Redownload and reverify draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/redownload"
          mkdir -p "$verify"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$verify" --pattern 'Interceptor-Browser-*-windows-*.exe' --pattern 'SHA256SUMS'
          cd "$verify"
          while read -r hash name; do
            echo "$hash  $name" | sha256sum -c - || { echo "Redownload hash mismatch: $name" >&2; exit 1; }
          done < SHA256SUMS
